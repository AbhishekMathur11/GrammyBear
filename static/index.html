<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TeddyTalk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="logo">🧸</span>
          <div>
            <p class="eyebrow">TeddyTalk</p>
            <h1>Speak, play, grow</h1>
          </div>
        </div>
        <div class="toolbar">
          <button id="btn-repeat" type="button" class="ghost-btn">Hear again</button>
          <button id="btn-mute" type="button" class="ghost-btn">Mute</button>
          <button id="btn-stop" type="button" class="ghost-btn danger">Stop</button>
          <div id="conn" class="pill">Connecting…</div>
        </div>
      </header>
      <p id="banner" class="banner hidden"></p>

      <section class="stage-grid">
        <article class="hero-card">
          <div id="stage" class="stage idle">Idle</div>
          <div id="bear" class="bear idle" aria-hidden="true">🧸</div>
          <p id="status" class="status">Choose a game to begin</p>
          <p id="prompt" class="prompt"></p>
          <canvas id="meter" width="420" height="48" class="meter"></canvas>
          <div class="setup">
            <label class="name-field">
              Child’s name
              <input id="kid-name" type="text" maxlength="20" placeholder="Sam" autocomplete="given-name" />
            </label>
            <p class="kicker">Teddy’s voice</p>
            <div id="voices" class="voices" role="group" aria-label="Teddy voice"></div>
          </div>
          <div class="modes">
            <button id="btn-complete" type="button" class="mode-btn amber">
              <span class="mode-kicker">Game 1</span>
              Finish the sentence
            </button>
            <button id="btn-mistake" type="button" class="mode-btn sky">
              <span class="mode-kicker">Game 2</span>
              Catch the mistake
            </button>
          </div>
        </article>

        <aside class="side">
          <div class="chat-card">
            <p class="kicker">Conversation</p>
            <div id="chat" class="chat">
              <div class="bubble teddy">Type a name, pick a voice, then choose a game.</div>
            </div>
          </div>
          <div class="heard-card">
            <p class="kicker">Teddy heard</p>
            <p id="heard">Waiting for your voice…</p>
          </div>
          <div class="board-card">
            <p id="feedback" class="feedback">I’ll cheer you on here.</p>
            <div class="stats">
              <div><span>Streak</span><strong id="streak">0</strong></div>
              <div><span>Best</span><strong id="best">0</strong></div>
              <div><span>Turns</span><strong id="turns">0</strong></div>
            </div>
          </div>
        </aside>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
